        pendingRefundAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '1000000.00'
        refundedAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '1000000.00'
        availableRefundAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '1000000.00'
