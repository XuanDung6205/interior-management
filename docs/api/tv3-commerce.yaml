          type: string
          pattern: ^\d+\.\d{2}$
          example: '1000000.00'
        currency:
          type: string
        reason:
          type: string
        reference:
          type: string
          nullable: true
        confirmationNote:
          type: string
          nullable: true
        resolutionNote:
          type: string
          nullable: true
