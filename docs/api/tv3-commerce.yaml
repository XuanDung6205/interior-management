          type: integer
          format: int64
        code: *id015
        name: *id016
        discountType: *id017
        discountValue: *id018
        maxDiscountAmount: *id019
        minimumOrderAmount: *id020
        totalUsageLimit: *id021
        perUserLimit: *id022
        startsAt: *id023
        endsAt: *id024
        isActive: *id025
        createdAt: *id023
        updatedAt: *id023
      required:
      - id
      - code
      - name
      - discountType
      - discountValue
      - maxDiscountAmount
      - minimumOrderAmount
      - totalUsageLimit
      - perUserLimit
      - startsAt
      - endsAt
      - isActive
