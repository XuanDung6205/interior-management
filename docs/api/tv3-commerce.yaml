        '403':
          $ref: '#/components/responses/StaffOrCsrfDenied'
        '404':
          $ref: '#/components/responses/OwnedResourceMissing'
        '409':
          description: 'NOTIFICATION_NOT_DEAD: the event is no longer DEAD. Refresh operations; do not guess event
