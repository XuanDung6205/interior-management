        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Trimmed, nonblank public customer reason.
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - orderItemId
            - quantity
            properties:
              orderItemId:
                type: integer
                format: int64
                minimum: 1
              quantity:
                type: integer
                minimum: 1
                maximum: 1000000
          maxItems: 1000
          minItems: 1
          description: Unique orderItemId values from the current owned order; quantities cannot exceed actual returnableQuantity.
    DecideCustomerReturn:
      type: object
      additionalProperties: false
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Trimmed nonblank private staff note; not the public customer reason.
    ReceiveCustomerReturn:
      type: object
      additionalProperties: false
      description: Warehouse must be active even when restockQuantity is zero. Stock rises only by explicit restockQuantity;
        reservations, shipment delivery, payment, and refund state are preserved.
      required:
      - warehouseId
      - items
      - acknowledged
      properties:
        warehouseId:
          type: integer
          format: int64
          minimum: 1
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - returnItemId
            - receivedQuantity
            - restockQuantity
            properties:
              returnItemId:
                type: integer
                format: int64
                minimum: 1
              receivedQuantity:
                type: integer
                minimum: 0
              restockQuantity:
                type: integer
                minimum: 0
              conditionNote:
                type: string
                nullable: true
                maxLength: 1000
                description: Optional private condition note, trimmed; null and blank normalize to empty.
          maxItems: 1000
          minItems: 1
          description: Exactly all return request lines, unique returnItemId. 0 <= restockQuantity <= receivedQuantity
            <= requested quantity for each line; at least one received unit overall.
        acknowledged:
          type: boolean
          enum:
          - true
          description: Staff explicitly attests physical receipt and inspection.
    CompleteInstallation:
      type: object
      additionalProperties: false
      required:
      - reference
      - acknowledged
      properties:
        reference:
          type: string
          pattern: ^[A-Za-z0-9._:/-]{6,150}$
          description: Trimmed immutable proof reference.
        note:
          type: string
          nullable: true
          maxLength: 1000
          description: Optional private staff proof note, trimmed; null and blank normalize to empty.
        acknowledged:
          type: boolean
          enum:
          - true
          description: Staff explicitly attests installation was physically completed.

    SePayConfiguration:
      type: object
      required:
      - enabled
      - environment
      - canReconcile
      properties:
        enabled:
          type: boolean
        environment:
          type: string
          enum:
          - SANDBOX
        canReconcile:
          type: boolean
        automation:
          $ref: '#/components/schemas/SePayAutomationConfiguration'
    SePayPaymentInstructions:
      type: object
      description: Persisted payee/code snapshots. qrUrl only appears for a currently payable pending payment
        with SePay enabled. No token or HMAC secret.
      properties:
        environment:
          type: string
        code:
          type: string
        bank:
          type: string
        accountNumber:
          type: string
        accountHolder:
          type: string
        transferContent:
          type: string
        qrUrl:
          type: string
        canReconcile:
          type: boolean
    SePayProcessingResult:
      type: object
      required:
      - success
      - eventId
      - processingStatus
      - duplicate
      properties:
        success:
          type: boolean
          enum:
          - true
        eventId:
          type: integer
          format: int64
        processingStatus:
          type: string
          enum:
          - PROCESSED
          - FAILED
          - IGNORED
        duplicate:
          type: boolean

    SePayAutomationConfiguration:
      type: object
      properties:
        enabled:
          type: boolean
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          example: 1800
        intervalSeconds:
          type: integer
          example: 60
      description: Enabled reflects safe automation configuration; expiry still requires successful current provider
        verification.
    SePayEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        paymentId:
          type: integer
          format: int64
          nullable: true
        orderId:
          type: integer
          format: int64
          nullable: true
        providerEventId:
          type: string
        status:
          type: string
          enum:
          - FAILED
          - IGNORED
          - PROCESSED
        reason:
          type: string
          nullable: true
        receivedAt:
          type: string
          format: date-time
        code:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
        amount:
          type: string
          nullable: true
        reviewStatus:
          type: string
          enum:
          - OPEN
          - REVIEWED
        reviewNote:
          type: string
          nullable: true
          maxLength: 1000
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewedBy:
          type: integer
          format: int64
          nullable: true
      description: Sanitized staff-only event with immutable review annotation. No raw payload or payer metadata.
    ReviewSePayEvent:
      type: object
      required:
      - note
      - expectedReviewStatus
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 1000
          description: Trimmed immutable staff note; whitespace-only rejected.
        expectedReviewStatus:
          type: string
          enum:
          - OPEN
    SePayReconciliationSummary:
      type: object
      properties:
        checked:
          type: integer
          minimum: 0
        matched:
          type: integer
          minimum: 0
        complete:
          type: boolean
    SePayJobResult:
      type: object
      properties:
        scanned:
          type: integer
          minimum: 0
        reconciled:
          type: integer
          minimum: 0
        expired:
          type: integer
          minimum: 0
        deferred:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
      description: One bounded batch, not an exhaustive all-history scan.
    SubmitSePayRefund:
      type: object
      required:
      - acknowledged
      properties:
        acknowledged:
          type: boolean
          enum:
          - true
          description: Staff explicitly approves this existing refund to be sent through Sandbox.
    SePayRefundExecution:
      type: object
      properties:
        state:
          type: string
          enum:
          - NOT_STARTED
          - UNKNOWN
          - PENDING
          - SUCCEEDED
          - FAILED
          - REJECTED
        refundId:
          type: string
          nullable: true
        canSubmit:
          type: boolean
        canSync:
          type: boolean
        message:
          type: string
      description: Present for SePay refunds. PENDING/UNKNOWN holds local budget. Never exposes idempotency key or token.

    SePayJobSnapshot:
      type: object
      properties:
        enabled:
          type: boolean
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        intervalSeconds:
          type: integer
          minimum: 30
          maximum: 3600
        batchSize:
          type: integer
          minimum: 1
          maximum: 20
        canRun:
          type: boolean
        queue:
          type: object
          properties:
            pending:
              type: integer
              minimum: 0
            due:
              type: integer
              minimum: 0
            leased:
              type: integer
              minimum: 0
      description: Pending-payment queue snapshot; recently cancelled recovery and successful metadata discovery may
        also be candidates. Does not expose API credentials.

    SePayWebhookAcknowledgement:
      type: object
      required: [success]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [true]
    CatalogVectorSnapshot:
      type: object
      additionalProperties: false
      description: Protected configuration and persisted vector work status. configured means key presence only;
        indexedProducts excludes generic vectors without catalog ownership.
      required:
      - enabled
      - configured
      - model
      - dimensions
      - batchSize
      - intervalSeconds
      - indexedProducts
      - outbox
      - deadEvents
      properties:
        enabled:
          type: boolean
        configured:
          type: boolean
        model:
          type: string
          enum: [gemini-embedding-001]
        dimensions:
          type: integer
          enum: [768]
        batchSize:
          type: integer
          minimum: 1
          maximum: 100
        intervalSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400
        indexedProducts:
          type: integer
          format: int64
          minimum: 0
        outbox:
          $ref: '#/components/schemas/CatalogVectorOutboxCounts'
        deadEvents:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/DeadCatalogVectorEvent'
    CatalogVectorOutboxCounts:
      type: object
      additionalProperties: false
      required: [pending, retry, sent, dead, leased]
      properties:
        pending:
          type: integer
          format: int64
          minimum: 0
        retry:
          type: integer
          format: int64
          minimum: 0
        sent:
          type: integer
          format: int64
          minimum: 0
        dead:
          type: integer
          format: int64
          minimum: 0
        leased:
          type: integer
          format: int64
          minimum: 0
          description: Subset of PENDING/RETRY rows whose lease is currently active.
    DeadCatalogVectorEvent:
      type: object
      additionalProperties: false
      required: [id, productId, attempts, lastError, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        productId:
          type: integer
          format: int64
          minimum: 1
        attempts:
          type: integer
          minimum: 0
        lastError:
          type: string
          pattern: '^VECTOR_[A-Z_]+$'
          description: Controlled code; never raw provider or SQL error text.
        updatedAt:
          type: string
          format: date-time
          description: UTC update instant.
    CatalogVectorReindexRequest:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        afterId:
          type: integer
          format: int64
          minimum: 0
          default: 0
          nullable: true
          description: Exclusive product cursor; omitted or null starts at zero.
        limit:
          type: integer
          minimum: 1
          maximum: 100
    CatalogVectorReindexResult:
      type: object
      additionalProperties: false
      required: [queued, skipped, nextAfterId, hasMore]
      properties:
        queued:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        nextAfterId:
          type: integer
          format: int64
          minimum: 0
        hasMore:
          type: boolean
    CatalogVectorRunRequest:
      type: object
      additionalProperties: false
      description: Empty JSON object; batch size comes from protected runtime configuration.
    CatalogVectorRunResult:
      type: object
      additionalProperties: false
      required: [scanned, indexed, deleted, retried, failed, skipped]
      properties:
        scanned:
          type: integer
          minimum: 0
          maximum: 100
        indexed:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
        retried:
          type: integer
          minimum: 0
          description: Subset of failed work scheduled for retry.
        failed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
    CatalogVectorRetryRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Trimmed nonblank staff reason recorded with the authenticated actor and retry time.
