      description: STAFF/ADMIN with CSRF and acknowledged=true. APPROVED -> RECEIVED with a server approval actor;
        the order remains PROCESSING/COMPLETED. Supply exactly all requested return lines, each once; 0 <= restockQuantity
        <= receivedQuantity <= requested quantity, at least one received unit overall, and an active warehouse. Rechecks
        original delivery/claim quantities under sorted user -> order root -> return/line -> warehouse shared -> variant/warehouse
        balance locks. Only explicit positive restockQuantity increases on_hand, preserves reserved quantities, increments
        balance version and creates one RETURN movement with unique return-item:<returnItemId>. receivedQuantity and
        restockedQuantity persist for RefundPolicy's discounted actual-received-goods cap. Exact normalized sorted
        receipt fingerprint replay preserves evidence and does not restock twice; different receipt returns RETURN_RECEIPT_CONFLICT;
        other states RETURN_STATE_CHANGED. No automatic refund/payment completion, order resurrection, or change of
