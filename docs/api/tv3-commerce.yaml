      summary: Deliver one bounded batch to the web inbox
      description: STAFF/ADMIN with CSRF; no request body. Selects at most 100 due PENDING/RETRY events. Per-row lock/recheck
        and unique delivered outbox ID make multiworker/repeated delivery safe. Notification insert and SENT transition
