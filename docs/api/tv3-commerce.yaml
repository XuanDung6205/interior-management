      description: Session owner with CSRF and Idempotency-Key. Order must be PROCESSING or COMPLETED. Unique current-order
        item IDs and positive quantities must fit actual delivered unclaimed quantities; claims in REQUESTED/APPROVED/IN_TRANSIT/RECEIVED/COMPLETED
        reserve their requested quantity. Resolution is fixed REFUND. Actor-scoped return number is RT- plus the first
        32 SHA-256 hex characters of the server-serialized actor ID/key intent. Under the shared user/order locks,
        replay compares stored order, normalized reason and sorted line intent before current eligibility, preserving
        selectedReturnId even after decision/receipt. Different intent returns IDEMPOTENCY_CONFLICT; excess quantity
