    PrintableOrder:
      type: object
      additionalProperties: false
      description: >-
        Same explicit safe allowlist for owner and staff print routes. Nested address, item,
        payment and refund projections reuse the public DTOs. Excludes customer user/directory
        fields, internal notes, staff identities, proofs, audit JSON and bank credentials.
        Original totals remain unchanged; the three summary amounts are computed by the server
        from actual persisted payment/refund statuses, never supplied by the browser.
      required:
      - id
      - orderNumber
      - status
      - currency
      - placedAt
      - subtotal
      - discountAmount
      - shippingFee
      - assemblyFee
      - taxAmount
      - grandTotal
      - couponCode
      - assemblyRequested
      - customerNote
      - shippingAddress
      - items
      - payments
      - refunds
      - collectedAmount
      - refundedAmount
      - pendingRefundAmount
      properties:
        id: *id027
        orderNumber: *id009
        status: *id009
        currency: *id009
        placedAt:
          type: string
          format: date-time
        subtotal: *id029
        discountAmount: *id029
        shippingFee: *id029
        assemblyFee: *id029
        taxAmount: *id029
        grandTotal: *id029
        couponCode: *id026
        assemblyRequested: *id028
        customerNote: *id026
        shippingAddress:
          $ref: '#/components/schemas/CheckoutAddress'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/OrderPayment'
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/OrderRefund'
        collectedAmount:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: Gross amount of SUCCEEDED collections, preserving original order totals.
          example: '50000.00'
        refundedAmount:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: Amount of SUCCEEDED refunds.
          example: '0.00'
        pendingRefundAmount:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: Amount held by PENDING refunds; not confirmed refunded money.
          example: '0.00'
    CustomerOrder:
