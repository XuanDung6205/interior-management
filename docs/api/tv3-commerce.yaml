              type: string
              nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        canConfirm:
          type: boolean
        canCancel:
          type: boolean
        actionBlockReason:
          type: string
          nullable: true
        sepayExecution:
          $ref: '#/components/schemas/SePayRefundExecution'
      description: Staff-only view. Private notes/processor identity never enter customer snapshots. PENDING reserves
        budget; manual proof or verified provider success settles money. Provider-claimed requests cannot be manually
        confirmed/cancelled.
    RefundPaymentBudget:
      type: object
      properties:
        id:
          type: integer
          format: int64
        method:
          type: string
        provider:
          type: string
        status:
          type: string
        amount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '1000000.00'
        currency:
          type: string
        pendingRefundAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '1000000.00'
        refundedAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '1000000.00'
        availableRefundAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '1000000.00'
        canRefund:
          type: boolean
    RefundReturnBudget:
      type: object
      properties:
        id:
          type: integer
          format: int64
        returnNumber:
          type: string
        refundableAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '1000000.00'
        availableRefundAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '1000000.00'
      description: Only same-order approved, physically received REFUND returns. Discounted
        received-goods cap excludes shipping/assembly. Actual payout also bounded by collection
        budgets.
    ManualRefundSummary:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        orderNumber:
          type: string
        orderStatus:
          type: string
        currency:
          type: string
        collectedAmount:
          type: string
          pattern: ^\d+\.\d{2}$
