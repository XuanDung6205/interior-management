components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: HttpOnly same-origin session; unsafe methods also require X-CSRF-TOKEN.
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
      required:
      - code
      - message
      - fieldErrors
    Csrf:
      type: object
      properties:
        token:
          type: string
        headerName:
          type: string
          example: X-CSRF-TOKEN
      required:
      - token
      - headerName
    SessionUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - ADMIN
            - STAFF
            - CUSTOMER
      required:
      - id
      - username
      - fullName
      - roles
    Session:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/SessionUser'
          nullable: true
      required:
      - authenticated
      - user
    CartWarning:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        itemId:
          type: integer
          format: int64
      required:
      - code
      - message
      - itemId
    CartLine:
      type: object
      properties:
        id:
          type: integer
          format: int64
        variantId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
          nullable: true
        sku:
          type: string
        productName:
          type: string
        variantName:
          type: string
        imageUrl:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        unitPrice: &id013
          type: string
          pattern: ^(0|[1-9][0-9]{0,12})(\.[0-9]{1,2})?$
          example: '12900000.00'
          description: Exact decimal amount; client must not calculate checkout totals.
        lineTotal:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
          description: Exact decimal response total. Display only; checkout later enforces its own monetary bounds.
        availableQuantity:
          type: integer
          minimum: 0
        active:
          type: boolean
        issues:
          type: array
          items:
            type: string
      required:
      - id
      - variantId
      - productId
      - sku
      - productName
      - variantName
      - imageUrl
      - quantity
      - unitPrice
      - lineTotal
      - availableQuantity
      - active
      - issues
    Cart:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        itemCount:
          type: integer
          format: int64
          minimum: 0
        subtotal:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
          description: Exact decimal response total. Display only; checkout later enforces its own monetary bounds.
        currency:
          type: string
          enum:
          - VND
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/CartWarning'
      required:
      - id
      - itemCount
      - subtotal
      - currency
      - items
      - warnings
    AddCartItem:
      type: object
      properties:
        variantId:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
      required:
      - variantId
      - quantity
    UpdateCartItem:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
      required:
      - quantity
    CatalogVariant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        sku:
          type: string
        productName:
          type: string
        variantName:
          type: string
        price: *id013
        imageUrl:
          type: string
          nullable: true
        active:
          type: boolean
        availableQuantity:
          type: integer
          minimum: 0
    CouponInput:
      type: object
      properties: &id014
        code: &id015
          type: string
          maxLength: 50
          description: Trimmed and canonicalized to uppercase; A-Z0-9_- only.
        name: &id016
          type: string
          maxLength: 150
          nullable: true
        discountType: &id017
          type: string
