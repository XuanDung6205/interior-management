    CreateManualRefund:
      type: object
      required:
      - paymentId
      - amount
      - reason
      properties:
        paymentId:
          type: integer
          format: int64
        amount:
          type: string
          pattern: ^[0-9]{1,13}(?:\.[0-9]{1,2})?$
          description: Strict positive decimal; server checks remaining gross collection
            less pending/successful holds per payment/order/return.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        returnRequestId:
          type: integer
          format: int64
          nullable: true
    ConfirmManualRefund:
      type: object
      required:
      - reference
      - acknowledged
      properties:
        reference:
          type: string
          pattern: ^[A-Za-z0-9._:/-]{6,150}$
        note:
          type: string
          nullable: true
          maxLength: 1000
        acknowledged:
          type: boolean
          enum:
          - true
      description: Staff attests already completed manual refund. No bank transfer is
        initiated. Exact normalized reference/note replay preserves first verifier/time/audit.
        Original collection remains SUCCEEDED.
    CancelManualRefund:
      type: object
      required:
      - reason
      - acknowledged
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        acknowledged:
          type: boolean
          enum:
          - true
      description: Explicitly attest no money was sent. Only unsent manual PENDING requests
        may cancel/release their held budget. Debt is not erased; replacement may be requested.
        Exact normalized reason replays.
