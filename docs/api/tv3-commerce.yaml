  /api/admin/orders/export.csv:
    get:
      operationId: exportStaffOrdersCsv
      summary: Download all matching staff orders as a bounded spreadsheet CSV
      tags:
      - Order administration
      security:
      - cookieSession: []
      description: |-
        Current STAFF or ADMIN role is required by Spring security and the service, including
        direct service invocation. Read-only GET; no CSRF token or business side effects.
        Uses the same status/query/fromDate/toDate filter as GET /api/admin/orders and ordering
        placed_at DESC, id DESC. Exports all matching rows, independently of the current page.
        Pagination, custom sorting, arbitrary IDs and SQL are not export inputs. Fetches at most
        5001 orders and rejects more than 5000 with 400 EXPORT_TOO_LARGE before publishing CSV.
        No matches yields the header only.

        UTF-8 BOM; comma delimiter; CRLF records; every cell double-quoted with embedded quotes
        doubled. Exactly 14 columns in order: Mã đơn; Ngày đặt (UTC+07:00); Trạng thái; Người nhận;
        Điện thoại; Tiền hàng; Giảm giá; Phí giao hàng; Phí lắp đặt; Thuế bổ sung; Tổng đơn;
        Tiền tệ; Đã thu; Đã hoàn. Amounts are fixed two-decimal dot strings without currency
        symbols; status is the stable server code; one row represents one order. Order totals
        are not asserted to be revenue. Collection/refund amounts are computed server-side.

        Human spreadsheet display export: prefix dangerous text with a tab when ASCII/full-width
        =,+,-,@ follows leading whitespace/control/format characters; leading tab/CR/LF is also
        treated as untrusted. This changes display text and is not lossless round-trip import
        or a universal safety guarantee after external transformations. Excludes full addresses,
        user directory data, internal notes, staff IDs, proof/reference credentials and hashes.
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum: ['', PENDING_CONFIRMATION, CONFIRMED, PROCESSING, COMPLETED, CANCELLED]
      - in: query
        name: query
        description: Literal search across order/customer/recipient fields; percent and underscore are not wildcards.
        schema:
          type: string
          maxLength: 150
      - $ref: '#/components/parameters/OrderFromDate'
      - $ref: '#/components/parameters/OrderToDate'
      responses:
        '200':
          description: Complete CSV download for at most 5000 matching orders; header-only for no matches.
          headers:
            Content-Disposition:
              description: Attachment with a server-generated UTC timestamp filename.
              schema:
                type: string
                example: attachment; filename="orders-20261121T030000Z.csv"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            text/csv;charset=UTF-8:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid filters/date range, or more than 5000 matching orders. No partial CSV is sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                dateRange:
                  value:
                    code: INVALID_DATE_RANGE
                    message: Invalid order placement date range.
                    fieldErrors: {}
                exportLimit:
                  value:
                    code: EXPORT_TOO_LARGE
                    message: Narrow the filters to export at most 5000 orders.
                    fieldErrors: {}
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          description: Current STAFF or ADMIN role required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
