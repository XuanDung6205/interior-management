components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: HttpOnly same-origin session; unsafe methods also require X-CSRF-TOKEN.
  parameters:
    OrderFromDate:
      in: query
      name: fromDate
      required: false
      description: >-
        Order placement day in Asia/Ho_Chi_Minh (UTC+07), YYYY-MM-DD. Inclusive start at local
        midnight; may be omitted. Malformed dates or fromDate after toDate return 400 INVALID_DATE_RANGE.
      schema:
        type: string
        format: date
        pattern: '^\d{4}-\d{2}-\d{2}$'
        example: '2026-11-21'
    OrderToDate:
      in: query
      name: toDate
      required: false
      description: >-
        Order placement day in Asia/Ho_Chi_Minh (UTC+07), YYYY-MM-DD. Inclusive end day,
        implemented as the next local midnight exclusive UTC bound; may be omitted.
        For 2026-11-21 the upper bound is 2026-11-21T17:00:00Z exclusive.
        Malformed dates or fromDate after toDate return 400 INVALID_DATE_RANGE.
      schema:
        type: string
        format: date
        pattern: '^\d{4}-\d{2}-\d{2}$'
        example: '2026-11-21'
    CommerceResourceId:
      in: path
      name: id
      required: true
      description: Persisted resource ID from the corresponding server response.
      schema:
        type: integer
        format: int64
        minimum: 1
    CommerceCsrfToken:
      in: header
      name: X-CSRF-TOKEN
      required: true
      description: Token returned by GET /api/csrf for this JSESSIONID session.
      schema:
        type: string
        minLength: 1
    AftercareIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Actor-scoped across orders. Persist the exact key and request intent until the uncertain result
        is resolved; replay is checked before current eligibility. Different order/reason/sorted line intent conflicts.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,64}$
        example: return-order-501-001
  responses:
    SessionRequired:
      description: An authenticated JSESSIONID session is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: AUTHENTICATION_REQUIRED
            message: Sign in to continue.
            fieldErrors: {}
    StaffOrCsrfDenied:
      description: STAFF/ADMIN role required on admin paths, or missing/invalid CSRF token on a mutation. Customer
        inbox and returns remain scoped to the current session owner.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: CSRF_INVALID
            message: Refresh the security token and try again.
            fieldErrors: {}
    OwnedResourceMissing:
      description: Resource is missing or belongs to another owner. No cross-owner details are disclosed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: Resource unavailable.
            fieldErrors: {}
    InvalidCommerceOperation:
      description: Malformed pagination, key, quantities, proof, reason, warehouse, duplicate item IDs, or missing
        explicit acknowledgement.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            validation:
              value:
                code: VALIDATION_ERROR
                message: Please correct the invalid fields.
                fieldErrors:
                  acknowledged: Explicit acknowledgement is required.
            page:
              value:
                code: INVALID_PAGE
                message: Invalid page or size.
                fieldErrors: {}
    AftercareConflict:
      description: Persisted intent, actual delivered quantity, warehouse, or current business state conflict. Reload
        current summary; preserve the exact uncertain request when retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            intent:
              value:
                code: IDEMPOTENCY_CONFLICT
                message: Key already used with a different intent.
                fieldErrors: {}
            quantity:
              value:
                code: RETURN_QUANTITY_EXCEEDED
                message: Requested quantity exceeds delivered unclaimed goods.
                fieldErrors: {}
            receipt:
              value:
                code: RETURN_RECEIPT_CONFLICT
                message: Receipt already recorded with different evidence.
                fieldErrors: {}
            state:
              value:
                code: RETURN_STATE_CHANGED
                message: Return state changed.
                fieldErrors: {}
            installation:
              value:
                code: INSTALLATION_ALREADY_COMPLETED
                message: Installation already recorded with different proof.
                fieldErrors: {}
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
      required:
      - code
      - message
      - fieldErrors
    Csrf:
      type: object
      properties:
        token:
          type: string
        headerName:
          type: string
          example: X-CSRF-TOKEN
      required:
      - token
      - headerName
    SessionUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - ADMIN
            - STAFF
            - CUSTOMER
      required:
      - id
      - username
      - fullName
      - roles
    Session:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/SessionUser'
          nullable: true
      required:
      - authenticated
      - user
    CartWarning:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        itemId:
          type: integer
          format: int64
      required:
      - code
      - message
      - itemId
    CartLine:
      type: object
      properties:
        id:
          type: integer
          format: int64
        variantId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
          nullable: true
        sku:
          type: string
        productName:
          type: string
        variantName:
          type: string
        imageUrl:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        unitPrice: &id013
          type: string
          pattern: ^(0|[1-9][0-9]{0,12})(\.[0-9]{1,2})?$
          example: '12900000.00'
          description: Exact decimal amount; client must not calculate checkout totals.
        lineTotal:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
          description: Exact decimal response total. Display only; checkout later enforces its own monetary bounds.
        availableQuantity:
          type: integer
          minimum: 0
        active:
          type: boolean
        issues:
          type: array
          items:
            type: string
      required:
      - id
