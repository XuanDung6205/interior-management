  /api/payments/sepay/webhook:
    post:
      operationId: receiveSePaySandboxWebhook
      tags:
      - SePay Sandbox
      security: []
      description: POST only CSRF exemption; verify HMAC-SHA256 over exact timestamp.raw_body bytes with
        five-minute tolerance. Authenticated mismatches are durably recorded with success=true and FAILED/IGNORED;
        this does not assert collection. Numeric webhook event IDs differ from API UUIDs.
      parameters:
      - in: header
        name: X-SePay-Signature
        required: true
        schema:
          type: string
      - in: header
        name: X-SePay-Timestamp
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Documented SePay webhook JSON; maximum raw body 65536 bytes. Required id, gateway,
                accountNumber, code/content, transferType, transferAmount, referenceCode, transactionDate.
            example:
              id: 12345
              gateway: VietinBank
              transactionDate: '2026-11-25 10:00:00'
              accountNumber: '0000000001'
              subAccount: null
              code: DH12345678
              content: SEVQR DH12345678
              transferType: in
              transferAmount: 100000
              referenceCode: FT-SANDBOX-12345
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SePayWebhookAcknowledgement'
        '400': &sepayPath001
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401': &sepayPath002
          description: Signature or session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403': &sepayPath003
          description: Staff role or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404': &sepayPath004
          description: Payment not found
