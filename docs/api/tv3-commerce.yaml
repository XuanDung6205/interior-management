      tags:
      - Commerce operations
      summary: Run one bounded batch of eligible COD expiries
      description: STAFF/ADMIN with CSRF; no request body and no force/backdate override. Scans at most 100 due rows
        and rechecks each under the shared order root lock in its own transaction. Only positive-total unconfirmed
        PENDING_CONFIRMATION orders with a persisted deadline and exclusively COD/COD evidence qualify; confirmed,
        collected, refunded, dispatched, mixed-provider, bank, zero-total, or legacy null-deadline orders are skipped.
        Successful expiry atomically cancels the order, expires pending payments, releases unfulfilled stock/coupon
        holds and enqueues a public notification. Failed rows retain holds and use durable backoff; late actual collection
        follows the existing refund path.
      security:
      - cookieSession: []
      parameters:
      - $ref: '#/components/parameters/CommerceCsrfToken'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiryBatchResult'
              example:
