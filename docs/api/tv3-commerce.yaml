      summary: Requeue an inspected DEAD notification event
      description: STAFF/ADMIN with CSRF and nonblank reason. Use an actual deadEvents.id from the operations snapshot.
        Only DEAD can change to RETRY; resets attempts to zero, clears controlled lastError, schedules immediate eligibility,
