          allowedTransitions:
            type: array
            items: *id012
          blockedTransitions:
            type: array
            items:
              $ref: '#/components/schemas/BlockedOrderTransition'
    AdminOrderSummary:
      allOf:
      - $ref: '#/components/schemas/CustomerOrderSummary'
      - type: object
        properties:
          customer:
            $ref: '#/components/schemas/AdminOrderCustomer'
          recipientName: *id033
          recipientPhone: *id033
    AdminOrderPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrderSummary'
        page: *id034
        size: *id034
        totalElements: *id034
        totalPages: *id034
    OrderTransitionRequest:
      type: object
      properties:
        fromStatus:
          type: string
          enum: &id035
          - PENDING_CONFIRMATION
          - CONFIRMED
          - PROCESSING
          - COMPLETED
          - CANCELLED
        toStatus:
          type: string
          enum: *id035
        note:
          type: string
          nullable: true
          maxLength: 1000
      required:
      - fromStatus
      - toStatus
      description: Only documented forward edges; CANCELLED requires a reason. Exact applied edge is replayed without another
        history/audit. Completion checks actual net collection, delivered/fulfilled quantities, movements and selected assembly.
    OrderInternalNoteRequest:
      type: object
      properties:
        internalNote:
          type: string
          nullable: true
          maxLength: 5000
        expectedInternalNote:
          type: string
          nullable: true
          maxLength: 5000
      required:
      - internalNote
      - expectedInternalNote
      description: Expected note is the exact prior value, including whitespace for imported notes. Stale edit409 INTERNAL_NOTE_CHANGED.
        Internal note never appears in public customer history.
    ManualPayment:
      type: object
      required:
      - id
      - orderId
      - method
      - provider
      - status
      - amount
      - currency
      - isExpired
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        method:
          type: string
          enum:
          - COD
          - BANK_TRANSFER
          - GATEWAY
        provider:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - EXPIRED
        amount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '2050000.00'
        currency:
          type: string
        reference:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        isExpired:
          type: boolean
    StaffManualPayment:
      allOf:
      - $ref: '#/components/schemas/ManualPayment'
      - type: object
        properties:
          confirmationNote:
            type: string
            nullable: true
          verifiedBy:
            type: object
            nullable: true
            properties:
              id:
                type: integer
                format: int64
              fullName:
                type: string
                nullable: true
          canConfirm:
            type: boolean
          confirmationMessage:
            type: string
            nullable: true
          isLateCollection:
            type: boolean
    ManualBankInstructions:
      type: object
      properties:
        mode:
          type: string
          enum:
          - UNCONFIGURED
          - DEMO
          - MANUAL
        configured:
          type: boolean
        isDemo:
          type: boolean
        notice:
          type: string
        bankName:
          type: string
          nullable: true
        accountNumber:
          type: string
          nullable: true
        accountHolder:
          type: string
          nullable: true
        transferContent:
          type: string
      description: DEMO is clearly fictitious and limited to isolated TV3 schemas; no
        real funds or bank sandbox. MANUAL validates formatting only. No bank API or external
        QR.
    ManualPaymentSummary:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        orderNumber:
          type: string
        orderStatus:
          type: string
        currency:
          type: string
        totalAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '2050000.00'
        collectedAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '2050000.00'
        pendingRefundAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '2050000.00'
        refundedAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '2050000.00'
        netCollectedAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '2050000.00'
        remainingAmount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '2050000.00'
        canCreate:
          type: boolean
        createBlockReason:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManualPayment'
        bankTransfer:
          $ref: '#/components/schemas/ManualBankInstructions'
      description: Gross SUCCEEDED collections cap the original receivable. Refunds never
        reopen it; pending refund is not completed repayment. Customer items never contain
        private verification fields.
    StaffManualPaymentSummary:
      allOf:
      - $ref: '#/components/schemas/ManualPaymentSummary'
      - type: object
        properties:
          selectedPaymentId:
            type: integer
            format: int64
          items:
            type: array
            items:
              $ref: '#/components/schemas/StaffManualPayment'
    ManualPaymentPage:
      type: object
      properties:
        items:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/StaffManualPayment'
            - type: object
              properties:
                orderNumber:
                  type: string
                orderStatus:
                  type: string
                customer:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                      nullable: true
                    username:
                      type: string
                      nullable: true
                    fullName:
                      type: string
                      nullable: true
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 0
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    CreateManualPayment:
      type: object
      required:
      - method
      properties:
        method:
          type: string
          enum:
          - COD
          - BANK_TRANSFER
    ConfirmManualPayment:
      type: object
      required:
      - reference
      - acknowledged
      properties:
        reference:
          type: string
          pattern: ^[A-Za-z0-9._:/-]{6,150}$
        note:
          type: string
          nullable: true
          maxLength: 1000
        acknowledged:
          type: boolean
          enum:
          - true
      description: Staff attests actual receipt reconciliation. Amount, verifier and UTC
        verification time are server-owned. Exact normalized reference/note replays without
        new audit; changed proof conflicts. Cancelled-order late collection queues a durable
        pending refund without resurrecting fulfillment.
