      operationId: completeSelectedInstallation
      tags:
      - Aftercare
      summary: Attest actual completion of a selected installation
      description: STAFF/ADMIN with CSRF, valid reference and acknowledged=true. Requires selected order assembly
        and an installation-required shipment with both DELIVERED status and delivered_at, with installation PENDING/SCHEDULED.
        Server records COMPLETED, UTC completion time and current staff actor in the same transaction as immutable
        private audit proof. Exact normalized reference/note replay preserves first staff/time; different proof returns
        INSTALLATION_ALREADY_COMPLETED; undelivered/unselected/ineligible installation returns INSTALLATION_NOT_READY.
        For PROCESSING orders only, invokes the existing shared lifecycle transition to COMPLETED when real delivery,
