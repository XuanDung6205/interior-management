          description: Exact decimal amount; client must not calculate checkout totals.
          default: '0.00'
        totalUsageLimit: &id021
          type: integer
          minimum: 1
          nullable: true
        perUserLimit: &id022
          type: integer
          minimum: 1
          nullable: true
        startsAt: &id023
          type: string
          format: date-time
          example: '2026-11-13T10:00:00Z'
        endsAt: &id024
          type: string
          format: date-time
          example: '2026-11-13T10:00:00Z'
          description: Must be after startsAt.
        isActive: &id025
          type: boolean
          default: true
      required:
      - code
      - discountType
      - discountValue
      - startsAt
      - endsAt
      additionalProperties: false
    CouponPreviewInput:
      type: object
      properties:
        merchandiseAmount: *id013
