openapi: 3.0.3
info:
  title: TV3 Furniture Commerce API
  version: 1.3.0
  description: 'TV3-01–08: session/CSRF, cart/coupons, checkout, customer/staff orders and manually verified COD/bank collections. Gateway integration, refund execution and coordinated expiry remain subsequent tasks.'
servers:
- url: http://localhost:8080
  description: Local Spring Boot commerce runtime
tags:
- name: Session
- name: Cart
- name: Catalog
- name: Coupons
- name: Checkout
- name: Orders
- name: Order administration
- name: Manual payments
paths:
  /api/csrf:
    get:
      operationId: getCsrf
      summary: Fetch current CSRF token
      tags:
      - Session
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        '400': &id001
          description: Invalid request or field validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401': &id002
          description: Session authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403': &id003
          description: Role denied or CSRF token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404': &id004
          description: Resource unavailable or belongs to another cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409': &id005
          description: Current data conflict, coupon referenced, or stock insufficient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/session:
    get:
      operationId: getSession
      summary: Get safe current actor/session
      tags:
      - Session
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
  /api/session/login:
    post:
      operationId: login
      summary: Sign in with directory-backed session
      tags:
      - Session
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      description: Refresh CSRF after login and explicitly merge guest cart. Password is never returned.
      parameters:
      - &id006
        name: X-CSRF-TOKEN
        in: header
        required: true
        description: Get token from GET /api/csrf. Refresh after login/logout.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
              required:
              - username
              - password
  /api/session/logout:
    post:
      operationId: logout
      summary: Sign out and invalidate session
      tags:
      - Session
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id006
  /api/cart:
    get:
      operationId: getCart
      summary: Get own cart and live SKU prices
      tags:
      - Cart
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
  /api/cart/items:
    post:
      operationId: addCartItem
      summary: Add an active SKU without reserving stock
      tags:
      - Cart
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItem'
    delete:
      operationId: clearCart
      summary: Clear only the current actor cart
      tags:
      - Cart
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id006
  /api/cart/items/{id}:
    patch:
      operationId: updateCartItem
      summary: Set own cart-line quantity
      tags:
      - Cart
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id006
      - &id007
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItem'
    delete:
      operationId: removeCartItem
      summary: Remove own cart line
      tags:
      - Cart
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id006
      - *id007
  /api/cart/merge:
    post:
      operationId: mergeCart
      summary: Consume guest cart into current authenticated user once
      tags:
      - Cart
      security:
      - cookieSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      description: Preserves inactive/over-stock lines with warnings; clears guest cookie after success.
      parameters:
      - *id006
  /api/commerce/catalog/variants:
    get:
      operationId: searchVariants
      summary: Read-only SKU integration bridge
      tags:
      - Catalog
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      parameters: &id008
      - name: query
        in: query
        schema:
          type: string
          default: ''
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
  /api/admin/coupons:
    get:
      operationId: listCoupons
      summary: 'STAFF/ADMIN: search and paginate coupons'
      tags:
      - Coupons
      security:
      - cookieSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponPage'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      parameters: *id008
    post:
      operationId: createCoupon
      summary: 'STAFF/ADMIN: create coupon'
      tags:
      - Coupons
      security:
      - cookieSession: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponInput'
  /api/admin/coupons/{id}:
    get:
      operationId: getCoupon
      summary: 'STAFF/ADMIN: coupon detail'
      tags:
      - Coupons
      security:
      - cookieSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id007
    patch:
      operationId: patchCoupon
      summary: 'STAFF/ADMIN: partially edit or deactivate coupon'
      tags:
      - Coupons
      security:
      - cookieSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      description: Nullable fields can explicitly be cleared with null. Referenced coupon code cannot be renamed; use isActive=false.
      parameters:
      - *id006
      - *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponPatch'
    delete:
      operationId: deleteCoupon
      summary: 'STAFF/ADMIN: delete only unreferenced coupon'
      tags:
      - Coupons
      security:
      - cookieSession: []
      responses:
        '204':
          description: Deleted
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      description: 409 COUPON_IN_USE if order/redemption references exist; deactivate instead.
      parameters:
      - *id006
      - *id007
  /api/admin/coupons/{id}/preview:
    post:
      operationId: previewCoupon
      summary: 'STAFF/ADMIN: calculate merchandise-only discount'
      tags:
      - Coupons
      security:
      - cookieSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponPreview'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      description: Checks active/date/minimum/value/cap. Does not reserve usage or prove checkout eligibility; usage concurrency
        is TV3-05.
      parameters:
      - *id006
      - *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponPreviewInput'
  /api/commerce/runtime:
    get:
      operationId: getCommerceRuntime
      summary: Read runtime identity and isolated-test-data flag
      tags:
      - Session
      security: []
      responses:
        '200':
          description: Runtime identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeInfo'
  /api/checkout/addresses:
    get:
      operationId: getCheckoutAddresses
      tags:
      - Checkout
      security:
      - cookieSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutAddressList'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: CSRF invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Owned resource missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/stock/coupon/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/checkout/quote:
    post:
      operationId: quoteCheckout
      tags:
      - Checkout
      security:
      - cookieSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutQuote'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: CSRF invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Owned resource missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/stock/coupon/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      parameters:
      - in: header
        name: X-CSRF-TOKEN
        required: true
        schema: &id009
          type: string
        description: Fetch from /api/csrf; refresh after login/logout.
  /api/checkout/orders:
    post:
      operationId: placeCheckoutOrder
      tags:
      - Checkout
      security:
      - cookieSession: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: CSRF invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Owned resource missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/stock/coupon/idempotency conflict
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ApiError'
                - $ref: '#/components/schemas/QuoteChanged'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,64}$
        description: User-scoped. Retry with identical body/key, including after network uncertainty.
      - in: header
        name: X-CSRF-TOKEN
        required: true
        schema: *id009
        description: Fetch from /api/csrf; refresh after login/logout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
  /api/orders:
    get:
      operationId: listCustomerOrders
      tags:
      - Orders
      security:
      - cookieSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrderPage'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: CSRF invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Owned resource missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/stock/coupon/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ''
          - PENDING_CONFIRMATION
          - CONFIRMED
          - PROCESSING
          - COMPLETED
          - CANCELLED
  /api/orders/{id}:
    get:
      operationId: getCustomerOrder
      tags:
      - Orders
      security:
      - cookieSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: CSRF invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Owned resource missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/stock/coupon/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - &id010
        in: path
        name: id
        required: true
        schema: &id027
          type: integer
          format: int64
  /api/orders/{id}/cancel:
    post:
      operationId: cancelCustomerOrder
      tags:
      - Orders
      security:
      - cookieSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: CSRF invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Owned resource missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/stock/coupon/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - *id010
      - in: header
        name: X-CSRF-TOKEN
        required: true
        schema: *id009
        description: Fetch from /api/csrf; refresh after login/logout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
  /api/admin/orders:
    get:
      operationId: listAdminOrders
      tags:
      - Order administration
      security:
      - cookieSession: []
      description: Requires current ADMIN or STAFF role.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderPage'
        '400':
          description: Invalid fields/query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Staff role or CSRF required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/note conflict or completion evidence missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ''
          - PENDING_CONFIRMATION
          - CONFIRMED
          - PROCESSING
          - COMPLETED
          - CANCELLED
      - in: query
        name: query
        schema:
          type: string
          maxLength: 150
        description: Literal search across order/customer/recipient fields; percent and underscore are not wildcards.
  /api/admin/orders/{id}:
    get:
      operationId: getAdminOrder
      tags:
      - Order administration
      security:
      - cookieSession: []
      description: Requires current ADMIN or STAFF role.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '400':
          description: Invalid fields/query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Staff role or CSRF required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/note conflict or completion evidence missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - &id011
        in: path
        name: id
        required: true
        schema: &id034
          type: integer
          format: int64
  /api/admin/orders/{id}/transitions:
    post:
      operationId: transitionAdminOrder
      tags:
      - Order administration
      security:
      - cookieSession: []
      description: Requires current ADMIN or STAFF role.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '400':
          description: Invalid fields/query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Staff role or CSRF required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/note conflict or completion evidence missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - *id011
      - in: header
        name: X-CSRF-TOKEN
        required: true
        schema: &id012
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTransitionRequest'
  /api/admin/orders/{id}/internal-note:
    patch:
      operationId: updateOrderInternalNote
      tags:
      - Order administration
      security:
      - cookieSession: []
      description: Requires current ADMIN or STAFF role.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '400':
          description: Invalid fields/query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session required
          content:
            application/json:
              schema:
