spring.application.name=eshop-commerce
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
logging.level.org.springframework.security=INFO
commerce.order.confirmation-ttl-seconds=${ORDER_CONFIRMATION_TTL_SECONDS:86400}
commerce.jobs.enabled=${COMMERCE_JOBS_ENABLED:true}
commerce.jobs.expiry-enabled=${ORDER_EXPIRY_ENABLED:true}
commerce.jobs.notification-enabled=${ORDER_NOTIFICATIONS_ENABLED:true}
commerce.jobs.delay-ms=${COMMERCE_JOB_DELAY_MS:10000}
commerce.payments.bank.mode=${PAYMENT_BANK_MODE:UNCONFIGURED}
commerce.payments.bank.bank-name=${PAYMENT_BANK_NAME:}
commerce.payments.bank.account-number=${PAYMENT_BANK_ACCOUNT_NUMBER:}
commerce.payments.bank.account-holder=${PAYMENT_BANK_ACCOUNT_HOLDER:}
# Project defaults; prices already include tax. Only the server applies these fees.
commerce.checkout.shipping-fee=${CHECKOUT_SHIPPING_FEE:50000.00}
commerce.checkout.free-shipping-threshold=${CHECKOUT_FREE_SHIPPING_THRESHOLD:10000000.00}
commerce.checkout.assembly-unit-fee=${CHECKOUT_ASSEMBLY_UNIT_FEE:100000.00}
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.mariadb.autoconfigure.MariaDbStoreAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageConnectionAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageAutoConfiguration

# SePay Webhooks Test mode only. No live gateway credentials are used.
commerce.payments.sepay.enabled=${SEPAY_ENABLED:false}
commerce.payments.sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}
commerce.payments.sepay.api-token=${SEPAY_API_TOKEN:}
commerce.payments.sepay.bank=${SEPAY_BANK:VietinBank}
commerce.payments.sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
commerce.payments.sepay.account-holder=${SEPAY_ACCOUNT_HOLDER:}
commerce.payments.sepay.automation-enabled=${SEPAY_AUTOMATION_ENABLED:true}
commerce.payments.sepay.payment-ttl-seconds=${SEPAY_PAYMENT_TTL_SECONDS:1800}
commerce.payments.sepay.reconciliation-interval-seconds=${SEPAY_RECONCILIATION_INTERVAL_SECONDS:60}
commerce.payments.sepay.batch-size=${SEPAY_BATCH_SIZE:5}
commerce.payments.sepay.late-reconciliation-hours=${SEPAY_LATE_RECONCILIATION_HOURS:72}
commerce.payments.sepay.refunds-enabled=${SEPAY_REFUNDS_ENABLED:false}

# TV5: bật/tắt cache đọc nội dung, dashboard và gợi ý (đặt false để đo cold cache)
commerce.tv5.cache.enabled=${TV5_CACHE_ENABLED:true}

# Opt-in catalog embeddings; commerce remains usable without an AI key.
commerce.vector.enabled=${VECTOR_ENABLED:false}
commerce.vector.batch-size=${VECTOR_BATCH_SIZE:5}
commerce.vector.interval-seconds=${VECTOR_INTERVAL_SECONDS:60}
commerce.vector.max-attempts=${VECTOR_MAX_ATTEMPTS:8}
